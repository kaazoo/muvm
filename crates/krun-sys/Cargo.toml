[package]
name = "krun-sys"
version = "1.17.2"
edition = "2021"
rust-version = "1.89.0"
description = "Rust bindings for libkrun"
repository = "https://github.com/containers/libkrun"
license = "Apache-2.0"
links = "krun"

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false }
pkg-config = { version = "0.3", default-features = false }

[features]
default = []
